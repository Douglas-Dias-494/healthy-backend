name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sobe a aplicação com banco em memória, aplica as migrações e roda todos os testes
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
