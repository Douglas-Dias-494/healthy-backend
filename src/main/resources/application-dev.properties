# ===== Perfil DEV (padrão): comodidade para desenvolver. NUNCA use em produção. =====

# Banco H2 em arquivo (os dados sobrevivem a reinicios)
spring.datasource.url=jdbc:h2:file:./data/healthydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo de desenvolvimento (público, está no repositório). Em produção é obrigatório definir outro.
healthy.jwt.secret=${HEALTHY_JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef}

# Cria usuários, consultas e receitas de teste (senha 123456) quando o banco está vazio
healthy.seed=true

# Angular em desenvolvimento
healthy.cors.allowed-origins=http://localhost:4200
healthy.frontend-url=http://localhost:4200
