# DEV profile (default): convenience for local development. Never use in production.

spring.datasource.url=jdbc:h2:file:./data/healthydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Public development-only secret (it is in the repository). Production must define its own.
healthy.jwt.secret=${HEALTHY_JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef}

# Creates sample users (password 123456), appointments and prescriptions when the database is empty
healthy.seed=true

healthy.cors.allowed-origins=http://localhost:4200
healthy.frontend-url=http://localhost:4200
