# ===== Perfil PROD: tudo que é sensível vem de variáveis de ambiente, sem valor padrão. =====
# Se alguma obrigatória faltar, a aplicação NÃO sobe (melhor do que rodar insegura).
#
# Obrigatórias:
#   HEALTHY_JWT_SECRET      segredo longo e aleatório (>= 32 caracteres), ex.: openssl rand -base64 48
#   HEALTHY_CORS_ORIGINS    endereço(s) do site, separados por vírgula, ex.: https://app.exemplo.com
#   HEALTHY_FRONTEND_URL    endereço do site (usado nos links do e-mail de recuperação de senha)
#   HEALTHY_MAIL_FROM       remetente dos e-mails, ex.: nao-responda@exemplo.com
#   SPRING_MAIL_HOST        servidor SMTP (e SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD)
# Opcional:
#   HEALTHY_DATABASE_URL    padrão: H2 em arquivo ./data/healthydb
#   HEALTHY_DATABASE_USER / HEALTHY_DATABASE_PASSWORD

spring.datasource.url=${HEALTHY_DATABASE_URL:jdbc:h2:file:./data/healthydb}
spring.datasource.username=${HEALTHY_DATABASE_USER:sa}
spring.datasource.password=${HEALTHY_DATABASE_PASSWORD:}
spring.jpa.show-sql=false

# Console do H2 e dados de teste DESLIGADOS
spring.h2.console.enabled=false
healthy.seed=false

healthy.jwt.secret=${HEALTHY_JWT_SECRET}
healthy.cors.allowed-origins=${HEALTHY_CORS_ORIGINS}
healthy.frontend-url=${HEALTHY_FRONTEND_URL}
healthy.mail.from=${HEALTHY_MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Atrás de um proxy reverso com HTTPS (nginx, load balancer): usa o IP real do cliente e o esquema https.
# Importante para o limite de tentativas por IP e para o cabeçalho HSTS.
server.forward-headers-strategy=framework
server.shutdown=graceful
