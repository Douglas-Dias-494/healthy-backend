# PROD profile: everything sensitive comes from environment variables, with no default values.
# If a required one is missing the application does NOT start (see ProductionSafetyChecks).
#
# Required:
#   HEALTHY_JWT_SECRET     long random secret (>= 32 chars), e.g. openssl rand -base64 48
#   HEALTHY_CORS_ORIGINS   site address(es), comma-separated, no wildcard
#   HEALTHY_FRONTEND_URL   site address (used in the password reset e-mail links)
#   HEALTHY_MAIL_FROM      sender of the e-mails
#   SPRING_MAIL_HOST       SMTP server (plus SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD)
# Optional:
#   HEALTHY_DATABASE_URL / HEALTHY_DATABASE_USER / HEALTHY_DATABASE_PASSWORD (default: H2 file ./data/healthydb)

spring.datasource.url=${HEALTHY_DATABASE_URL:jdbc:h2:file:./data/healthydb}
spring.datasource.username=${HEALTHY_DATABASE_USER:sa}
spring.datasource.password=${HEALTHY_DATABASE_PASSWORD:}
spring.jpa.show-sql=false

spring.h2.console.enabled=false
healthy.seed=false

healthy.jwt.secret=${HEALTHY_JWT_SECRET}
healthy.cors.allowed-origins=${HEALTHY_CORS_ORIGINS}
healthy.frontend-url=${HEALTHY_FRONTEND_URL}
healthy.mail.from=${HEALTHY_MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Behind a TLS-terminating reverse proxy: use the real client IP (rate limiting) and the https scheme (HSTS)
server.forward-headers-strategy=framework
server.shutdown=graceful
