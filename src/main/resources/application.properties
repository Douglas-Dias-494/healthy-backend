spring.application.name=healthy-api
# Profiles: "dev" (default) and "prod" (SPRING_PROFILES_ACTIVE=prod, see application-prod.properties)
spring.profiles.default=dev
server.port=8080

spring.datasource.driver-class-name=org.h2.Driver

# The schema is created and changed ONLY by the Flyway migrations (src/main/resources/db/migration).
# Hibernate just validates that the entities match it: if they do not, the application does not start.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Databases created before Flyway (no history table) are treated as already being at version 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

healthy.jwt.expiracao=8h
healthy.security.reset-token-ttl=30m

# Do not leak internal details in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
