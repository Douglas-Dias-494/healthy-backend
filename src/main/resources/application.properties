# ===== Configuração comum a todos os perfis =====
# Perfis: "dev" (padrão, para desenvolver) e "prod" (ver application-prod.properties).
# Para produção: SPRING_PROFILES_ACTIVE=prod
spring.application.name=healthy-api
spring.profiles.default=dev
server.port=8080

# Banco H2
spring.datasource.driver-class-name=org.h2.Driver

# O esquema é criado e alterado SOMENTE pelas migrações Flyway (src/main/resources/db/migration).
# O Hibernate apenas CONFERE (validate) se as @Entity batem com o banco: se não baterem, a aplicação não sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Bancos criados antes do Flyway (sem histórico) são tratados como já estando na versão 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT: quanto tempo um token vale
healthy.jwt.expiracao=8h

# Recuperação de senha: validade do link
healthy.security.reset-token-ttl=30m

# Não vazar detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
