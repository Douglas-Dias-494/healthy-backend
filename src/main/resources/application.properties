spring.application.name=healthy-api
server.port=8080

# Banco H2 (arquivo local: os dados sobrevivem a reinicios)
spring.datasource.url=jdbc:h2:file:./data/healthydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: o Hibernate cria/atualiza as tabelas a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web do H2: http://localhost:8080/h2-console (somente desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
# ATENCAO: o valor padrao abaixo existe so para desenvolvimento. Em producao defina a variavel de
# ambiente HEALTHY_JWT_SECRET com um segredo proprio, longo e aleatorio. Quem souber a chave
# consegue fabricar tokens de qualquer usuario.
healthy.jwt.secret=${HEALTHY_JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef}
healthy.jwt.expiracao=8h

# Cria usuarios de teste (senha 123456) quando o banco esta vazio. Desligar fora do desenvolvimento.
healthy.seed=true
