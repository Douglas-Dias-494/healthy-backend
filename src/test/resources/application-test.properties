# "test" profile: in-memory database, separate from the development one (./data/healthydb).
# Flyway migrations really run, and Hibernate validates the entities against them.
spring.datasource.url=jdbc:h2:mem:healthy-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
spring.h2.console.enabled=false

healthy.jwt.secret=segredo-somente-para-testes-0123456789abcdef-ABCDEF
healthy.seed=true
healthy.cors.allowed-origins=http://localhost:4200
healthy.frontend-url=http://localhost:4200
