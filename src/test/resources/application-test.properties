# Perfil "test": banco em memória, separado do banco de desenvolvimento (./data/healthydb).
# Assim os testes não sujam os seus dados nem travam se a API estiver rodando.
spring.datasource.url=jdbc:h2:mem:healthy-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
healthy.seed=true
